<g style="animation-delay:0.60s" class="ln"><clipPath id="c0"><rect class="ty" style="animation:ty 0.36s steps(8) 0.60s both;--w:308px;--s:217px" x="40" y="54" height="34"/></clipPath><text clip-path="url(#c0)" class="mono" x="40" y="78"><tspan fill="#8db8ff">arazzki</tspan><tspan fill="#5b6272">@github</tspan><tspan fill="#b3b9c7"> ~ $ </tspan><tspan fill="#f5f6f8">whoami</tspan></text></g><text class="mono ln fadein" style="animation-delay:1.21s" x="40" y="112" fill="#b3b9c7">  Ariq Azzki · Information Technology @ Telkom University</text><g style="animation-delay:1.56s" class="ln"><clipPath id="c2"><rect class="ty" style="animation:ty 0.67s steps(15) 1.56s both;--w:388px;--s:217px" x="40" y="122" height="34"/></clipPath><text clip-path="url(#c2)" class="mono" x="40" y="146"><tspan fill="#8db8ff">arazzki</tspan><tspan fill="#5b6272">@github</tspan><tspan fill="#b3b9c7"> ~ $ </tspan><tspan fill="#f5f6f8">cat focus.txt</tspan></text></g><text class="mono ln fadein" style="animation-delay:2.48s" x="40" y="180" fill="#b3b9c7">  Low-level systems, socket relays &amp; native desktop apps (Rust, C++, Go)</text><text class="mono ln fadein" style="animation-delay:2.83s" x="40" y="214" fill="#b3b9c7">  Scalable backend architectures, distributed services &amp; campus platforms</text><g style="animation-delay:3.19s" class="ln"><clipPath id="c5"><rect class="ty" style="animation:ty 1.12s steps(25) 3.19s both;--w:502px;--s:217px" x="40" y="224" height="34"/></clipPath><text clip-path="url(#c5)" class="mono" x="40" y="248"><tspan fill="#8db8ff">arazzki</tspan><tspan fill="#5b6272">@github</tspan><tspan fill="#b3b9c7"> ~ $ </tspan><tspan fill="#f5f6f8">cat active_projects.txt</tspan></text></g><text class="mono ln fadein" style="animation-delay:4.56s" x="40" y="282" fill="#b3b9c7">  Kripton — native Windows living notch &amp; smart island HUD (Rust + Slint UI)</text><text class="mono ln fadein" style="animation-delay:4.91s" x="40" y="316" fill="#b3b9c7">  SewaKit — monorepo campus peer-to-peer gear &amp; IoT rental platform</text><g style="animation-delay:5.26s" class="ln"><clipPath id="c8"><rect class="ty" style="animation:ty 0.72s steps(16) 5.26s both;--w:399px;--s:217px" x="40" y="326" height="34"/></clipPath><text clip-path="url(#c8)" class="mono" x="40" y="350"><tspan fill="#8db8ff">arazzki</tspan><tspan fill="#5b6272">@github</tspan><tspan fill="#b3b9c7"> ~ $ </tspan><tspan fill="#f5f6f8">cat stack.json</tspan></text></g><text class="mono ln fadein" style="animation-delay:6.23s" x="40" y="384" fill="#b3b9c7">  ["Rust", "Go", "C++", "Python", "TypeScript", "Next.js", "Laravel", "PostgreSQL"]</text><g style="animation-delay:6.58s" class="ln"><clipPath id="c10"><rect class="ty" style="animation:ty 0.63s steps(14) 6.58s both;--w:376px;--s:217px" x="40" y="394" height="34"/></clipPath><text clip-path="url(#c10)" class="mono" x="40" y="418"><tspan fill="#8db8ff">arazzki</tspan><tspan fill="#5b6272">@github</tspan><tspan fill="#b3b9c7"> ~ $ </tspan><tspan fill="#f5f6f8">echo $STATUS</tspan></text></g><text class="mono ln fadein" style="animation-delay:7.46s" x="40" y="452" fill="#4ade80">✓ Open to internships, research &amp; engineering collaborations</text>
