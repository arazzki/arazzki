<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="534" viewBox="0 0 1200 534" role="img" aria-label="About Ariq Azzki">
<title>About Ariq Azzki</title>
<style>
.mono{font-family:ui-monospace,'SFMono-Regular','Cascadia Code',Consolas,'Liberation Mono',monospace;font-size:19px;}
.ty{width:var(--s);}
@keyframes ty{from{width:var(--s)}to{width:var(--w)}}
.fadein{animation:fi .35s ease both;}
@keyframes fi{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.ln{opacity:1}
g.ln{animation:show 0s linear both;}
@keyframes show{from{opacity:0}to{opacity:1}}
.cur2{animation:show 0s 7.81s both;}
.cur{fill:#8db8ff;animation:show 0s 7.81s both,blink 1s steps(1) 7.81s infinite;}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation-duration:0s!important;animation-delay:0s!important;animation-iteration-count:1!important;}}
</style>
